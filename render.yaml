# Render Blueprint: one Docker web service plus Postgres (pgvector is enabled by the first
# migration). Secrets marked sync:false are entered in the Render dashboard.
databases:
  - name: stc-db
    plan: free
    databaseName: stc
    user: stc

services:
  - type: web
    name: stc-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: stc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false # your Vercel URL, e.g. https://stc.vercel.app
      - key: GEMINI_API_KEY
        sync: false # paste your key here
